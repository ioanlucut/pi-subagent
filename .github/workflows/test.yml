name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm test
      # verify:e2e runs real Pi with a fake model, so it needs no login. It is the only check that loads index.ts.
      - run: npm install -g @earendil-works/pi-coding-agent@1.5.2
      - run: npm run verify:e2e
