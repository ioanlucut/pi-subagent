<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Pi Subagent</title>
  <desc id="desc">A parent Pi hands work to child Pis and gets their answers back.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f0ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)" stroke="#e5e7eb" stroke-width="2"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="132" font-size="64" font-weight="700" fill="#1f2328">Pi Subagent</text>
    <text x="66" y="182" font-size="26" fill="#57606a">Hand work to other Pis. Watch them.</text>
    <text x="66" y="218" font-size="26" fill="#57606a">Get their answers back.</text>
    <rect x="66" y="252" width="180" height="6" rx="3" fill="url(#accent)"/>
    <text x="66" y="300" font-size="18" fill="#6e7781">full Pi children · tmux · queue · worktrees · guarded</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <rect x="700" y="60" width="200" height="64" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="800" y="99" text-anchor="middle" fill="#5b21b6">parent Pi</text>
    <path d="M800 124 C800 170 760 170 760 214" stroke="#7c3aed" stroke-width="2" fill="none"/>
    <path d="M800 124 C800 170 960 170 960 214" stroke="#7c3aed" stroke-width="2" fill="none"/>
    <path d="M800 124 C800 170 1060 140 1100 214" stroke="#2563eb" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
    <rect x="680" y="214" width="160" height="56" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="760" y="248" text-anchor="middle" fill="#1d4ed8">⟳ review</text>
    <rect x="880" y="214" width="160" height="56" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <text x="960" y="248" text-anchor="middle" fill="#1d4ed8">⟳ impl-17</text>
    <rect x="1060" y="214" width="96" height="56" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="1108" y="248" text-anchor="middle" fill="#6e7781">queued</text>
    <text x="760" y="300" text-anchor="middle" fill="#15803d">✓ answer</text>
    <text x="960" y="300" text-anchor="middle" fill="#15803d">✓ answer</text>
  </g>
</svg>
