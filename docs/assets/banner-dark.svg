<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Pi Subagent</title>
  <desc id="desc">A parent Pi hands work to child Pis and gets their answers back.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="132" font-size="64" font-weight="700" fill="#f0f6fc">Pi Subagent</text>
    <text x="66" y="182" font-size="26" fill="#9da7b3">Hand work to other Pis. Watch them.</text>
    <text x="66" y="218" font-size="26" fill="#9da7b3">Get their answers back.</text>
    <rect x="66" y="252" width="180" height="6" rx="3" fill="url(#accent)"/>
    <text x="66" y="300" font-size="18" fill="#6e7681">full Pi children · tmux · queue · worktrees · guarded</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <rect x="700" y="60" width="200" height="64" rx="14" fill="#1f2937" stroke="#a78bfa" stroke-width="2"/>
    <text x="800" y="99" text-anchor="middle" fill="#e9d5ff">parent Pi</text>
    <path d="M800 124 C800 170 760 170 760 214" stroke="#a78bfa" stroke-width="2" fill="none"/>
    <path d="M800 124 C800 170 960 170 960 214" stroke="#a78bfa" stroke-width="2" fill="none"/>
    <path d="M800 124 C800 170 1060 140 1100 214" stroke="#60a5fa" stroke-width="2" fill="none" stroke-dasharray="6 6"/>
    <rect x="680" y="214" width="160" height="56" rx="12" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
    <text x="760" y="248" text-anchor="middle" fill="#bfdbfe">⟳ review</text>
    <rect x="880" y="214" width="160" height="56" rx="12" fill="#111827" stroke="#60a5fa" stroke-width="2"/>
    <text x="960" y="248" text-anchor="middle" fill="#bfdbfe">⟳ impl-17</text>
    <rect x="1060" y="214" width="96" height="56" rx="12" fill="#111827" stroke="#374151" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="1108" y="248" text-anchor="middle" fill="#6e7681">queued</text>
    <text x="760" y="300" text-anchor="middle" fill="#86efac">✓ answer</text>
    <text x="960" y="300" text-anchor="middle" fill="#86efac">✓ answer</text>
  </g>
</svg>
